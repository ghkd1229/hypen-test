<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hwang Tae Hee — Graphic designer portfolio" />
    <title>Hwang Tae Hee — Graphic Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;500;600&family=Roboto+Mono:wght@400&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=79" />
    <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>
    <script src="/interactions.js?v=75" defer></script>
  </head>
  <body class="is-loading">
    <div class="cursor-dot" aria-hidden="true"></div>

    <div class="intro" aria-label="페이지를 불러오는 중" role="status">
      <div class="intro-track" aria-hidden="true">
        <span class="intro-fill"></span>
      </div>
      <span class="intro-percent">00</span>
    </div>

    <main class="site-stage">
      <section class="hero hero-70" id="home" aria-labelledby="hero-title">
        <h1 id="hero-title" class="sr-only">Hwang Tae Hee Portfolio</h1>
        <img class="hero-70-photo" src="/images/hero-70-photo.png" alt="손과 실로 구성된 Hwang Tae Hee 포트폴리오 히어로 디자인" />
        <div class="hero-70-ui">
          <div class="hero-70-top">
            <img class="hero-70-logo" src="/images/hero-70-logo.svg" alt="Hwang Tae Hee 로고" />
            <button class="hero-70-menu-title" type="button" aria-expanded="false" aria-controls="hero-menu-panel">MENU</button>
          </div>
          <div class="hero-70-menu" id="hero-menu-panel" aria-hidden="true">
            <div class="hero-70-rail" aria-hidden="true">
              <img src="/images/hero-70-menu-line.svg" alt="" />
              <span class="hero-70-rail-dot"></span>
            </div>
            <nav aria-label="포트폴리오 메뉴">
              <span>WORKS</span>
              <span>ABOUT</span>
              <a href="mailto:ghkkd1229@gmail.com">CONTACT</a>
            </nav>
          </div>
        </div>
      </section>
      <section class="spline-scroll-sequence" aria-label="스크롤로 진행되는 3D 애니메이션">
        <div class="hero-spline-frame" aria-label="마우스와 스크롤에 반응하는 3D 애니메이션">
          <spline-viewer
            url="https://prod.spline.design/XVAZc2MLlIN1afBk/scene.splinecode"
            events-target="global"
          ></spline-viewer>
        </div>
        <span class="sr-only" data-spline-state="1">3D 애니메이션 첫 번째 상태</span>
        <span class="sr-only" data-spline-state="2">3D 애니메이션 두 번째 상태</span>
      </section>
    </main>
  </body>
</html>
